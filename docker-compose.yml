  #   depends_on:
  #     - db
  #     - redis
  #     - care_inn

  adminer:
    image: adminer:latest
    ports:
      - "8090:8080"
    depends_on:
      - db
    environment:
      - ADMINER_DEFAULT_SERVER=db

volumes:
  postgres_data:
  redis_data:

