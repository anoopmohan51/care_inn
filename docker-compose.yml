  #   depends_on:
  #     - db
  #     - redis
  #     - care_inn

  # celery_beat:
  #   build: .
  #   command: celery -A care_inn beat --loglevel=info
  #   volumes:
  #     - .:/app
  #   environment:
  #     - DEBUG=1
  #     - DB_NAME=careinn_dev1_db
  #     - DB_USER=careinn_user
  #     - DB_PASSWORD=Careinn12**
  #     - DB_HOST=db
